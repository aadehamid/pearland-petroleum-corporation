# PPC Dagster Instance Configuration (ADR-0045, ADR-0046, ADR-0055)
# Enforces single-writer Delta concurrency pool = 1 per table and stores
# Dagster run/event/schedule metadata in PostgreSQL.

run_coordinator:
  module: dagster.core.run_coordinator
  class: QueuedRunCoordinator
  config:
    max_concurrent_runs: 4
    tag_concurrency_limits:
      - key: "dagster/concurrency_key"
        value: "delta_table_single_writer"
        limit: 1

telemetry:
  enabled: false
