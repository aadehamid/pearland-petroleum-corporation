design_basis_version: "1.0.0"
provenance_class: "SYNTHETIC"
facility_id: "SITE-REF-A"
facility_name: "Pearland Refinery A"
padd: "PADD 3"
site_timezone: "America/Chicago"

horizon:
  warmup_days: 30
  synthetic_history_months: 12
  canonical_step_seconds: 60
  provenance_class: "SYNTHETIC"

crude_slate:
